# Tmux Baseline Configuration
# Automatically installed by omarchy-supplement

# 1. Base settings
set-option -g default-shell /usr/bin/zsh
set -g mouse on               # Enable mouse support (clickable windows, panes, scrolling)
set -g base-index 1           # Start windows and panes at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on    # Renumber windows when one is closed

# Modern colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# 2. Tmux Plugin Manager (TPM)
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Persistence Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum settings
set -g @continuum-restore 'on'    # Automatically restore the last saved environment when tmux starts
set -g @continuum-save-interval '15' # Save every 15 minutes

# Theme / Aesthetics
set -g @plugin 'dracula/tmux'
set -g @dracula-show-powerline true
set -g @dracula-plugins "cpu-usage ram-usage time"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g status-position top

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
